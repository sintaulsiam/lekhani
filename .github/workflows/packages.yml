name: Package Release Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

jobs:
  build-ubuntu-deb:
    name: Build Ubuntu / Debian (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev cmake extra-cmake-modules build-essential libibus-1.0-dev

      - name: Build Debian Packages
        run: ./packaging/debian/build-deb.sh

      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-ubuntu-deb
          path: dist/deb/*.deb

  build-fedora-rpm:
    name: Build Fedora / RHEL (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Build Dependencies
        run: |
          dnf install -y git cargo rust gcc-c++ cmake extra-cmake-modules fcitx5-devel ibus-devel rpm-build rpmdevtools

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Fedora RPM Packages
        run: ./packaging/fedora/build-rpm.sh

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-fedora-rpm
          path: dist/rpm/*.rpm

  build-arch-pkg:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Setup Arch Linux Build Environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git base-devel rust cargo cmake extra-cmake-modules fcitx5 sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Arch Packages as Non-Root
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "./packaging/arch/build-arch.sh"

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-arch-pkg
          path: dist/arch/*.pkg.tar.zst

name: Package Release Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packages.yml'
  workflow_dispatch:

jobs:
  build-ubuntu-deb:
    name: Build Ubuntu / Debian (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev cmake extra-cmake-modules build-essential libibus-1.0-dev libfontconfig1-dev libxkbcommon-dev pkg-config

      - name: Build Debian Packages
        run: ./packaging/debian/build-deb.sh

      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-ubuntu-deb
          path: dist/deb/*.deb

  build-fedora-rpm:
    name: Build Fedora / RHEL (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Build Dependencies
        run: |
          dnf install -y git cargo rust gcc-c++ cmake extra-cmake-modules fcitx5-devel ibus-devel rpm-build rpmdevtools fontconfig-devel libxkbcommon-devel

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Fedora RPM Packages
        run: ./packaging/fedora/build-rpm.sh

      - name: Upload RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-fedora-rpm
          path: dist/rpm/*.rpm

  build-arch-pkg:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Setup Arch Linux Build Environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git base-devel rust cargo cmake extra-cmake-modules fcitx5 sudo fontconfig
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Arch Packages as Non-Root
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && ./packaging/arch/build-arch.sh"

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-arch-pkg
          path: dist/arch/*.pkg.tar.zst

  build-portable-tarball:
    name: Build Universal Portable Archive (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev cmake extra-cmake-modules build-essential libibus-1.0-dev libfontconfig1-dev libxkbcommon-dev pkg-config

      - name: Build Release Binaries & Plugin
        run: |
          cargo build --release --workspace
          cmake -B crates/lekhani-fcitx5/build -S crates/lekhani-fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build crates/lekhani-fcitx5/build --config Release

      - name: Create Portable Tarball
        run: |
          VERSION="1.0.0"
          ARCH="$(uname -m)"
          TARBALL_NAME="lekhani-v${VERSION}-linux-${ARCH}.tar.gz"
          PORTABLE_DIR="target/portable_build/lekhani-v${VERSION}"
          mkdir -p "$PORTABLE_DIR/bin" "$PORTABLE_DIR/fcitx5" dist
          cp install.sh uninstall.sh "$PORTABLE_DIR/"
          cp -r data "$PORTABLE_DIR/"
          cp target/release/lekhani target/release/lekhani-gui target/release/ibus-lekhani "$PORTABLE_DIR/bin/"
          if [ -f crates/lekhani-fcitx5/build/fcitx5-lekhani.so ]; then
            cp crates/lekhani-fcitx5/build/fcitx5-lekhani.so "$PORTABLE_DIR/fcitx5/"
          fi
          tar -czf "dist/${TARBALL_NAME}" -C target/portable_build "lekhani-v${VERSION}"
          echo "Created dist/${TARBALL_NAME}"

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekhani-portable-tarball
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-ubuntu-deb
      - build-fedora-rpm
      - build-arch-pkg
      - build-portable-tarball
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          echo "=== Release Assets to Publish ==="
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

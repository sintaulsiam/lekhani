name: Lekhani CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev cmake extra-cmake-modules build-essential libfontconfig1-dev libxkbcommon-dev libibus-1.0-dev pkg-config

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --workspace --verbose

  build:
    name: Multi-Arch Binary Builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Fcitx5, IBus & GUI deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev cmake extra-cmake-modules build-essential libfontconfig1-dev libxkbcommon-dev libibus-1.0-dev pkg-config

      - name: Build Release Binaries
        run: cargo build --workspace --release --verbose

      - name: Build Native Fcitx5 Plugin
        run: |
          cmake -B crates/lekhani-fcitx5/build -S crates/lekhani-fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build crates/lekhani-fcitx5/build --config Release

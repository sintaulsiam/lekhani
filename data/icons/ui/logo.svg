<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="24" height="24" fill="none">
  <defs>
    <!-- Ambient Mint Glow -->
    <radialGradient id="logoAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5b8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e5b8" stop-opacity="0"/>
    </radialGradient>

    <!-- Nib Body Gradient -->
    <linearGradient id="logoNibGrad" x1="50%" y1="20%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#18483a"/>
      <stop offset="60%" stop-color="#0e2f25"/>
      <stop offset="100%" stop-color="#071c15"/>
    </linearGradient>

    <!-- Nib Stroke Gradient -->
    <linearGradient id="logoNibStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#00e5b8"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Spacebar Horizon Line Gradient -->
    <linearGradient id="logoSpacebarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5b8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00e5b8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="54" cy="52" r="34" fill="url(#logoAmbientGlow)"/>

  <!-- Fountain Pen Nib Silhouette -->
  <path d="M 32,23 C 27,23 24,26 25,31 C 26,38 30,46 34,52 L 51.5,78.5 C 52.6,80.2 55.4,80.2 56.5,78.5 L 74,52 C 78,46 82,38 83,31 C 84,26 81,23 76,23 Z"
        fill="url(#logoNibGrad)"
        stroke="url(#logoNibStroke)"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Breather Hole -->
  <circle cx="54" cy="33" r="2.8" fill="#092019" stroke="#00e5b8" stroke-width="1.6"/>

  <!-- Ink Slit Line -->
  <line x1="54" y1="35.5" x2="54" y2="78.5" stroke="#00e5b8" stroke-width="1.8" stroke-linecap="round"/>


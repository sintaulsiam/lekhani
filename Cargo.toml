[workspace]
members = [
    "crates/lekhani-settings",
    "crates/lekhani-ffi",
    "crates/lekhani-ibus",
    "crates/lekhani-gui",
    "crates/lekhani-cli",
    "crates/lekhani-tsf",
]

resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["Sintaul Mahdi Siam <sintaulsiam@gmail.com>", "Syntenieum"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/sintaulsiam/lekhani"
homepage = "https://github.com/sintaulsiam/lekhani"
description = "Modern, ultra-fast pure Rust Bengali input method framework and desktop suite for IBus, Fcitx5, and KDE. © 2026 Syntenieum. With special thanks to Avro Keyboard (OmicronLab) and OpenBangla Keyboard."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
zbus = { version = "4.0", default-features = false, features = ["async-io"] }
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
edit-distance = "2.1"
rayon = "1.8"
hashbrown = { version = "0.14", features = ["serde", "rayon"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
slint = "1.4"
quick-xml = "0.31"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memmap2 = "0.9"
bincode = "1.3"
lekhani-parser = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.2.0" }
lekhani-ai     = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.2.0" }
lekhani-core   = { git = "https://github.com/sintaulsiam/lekhani-engine", tag = "v1.2.0" }

# ── Local override for simultaneous engine development ───────────────────────
# Uncomment when editing lekhani-engine at the same time as this repo:
#
# [patch."https://github.com/sintaulsiam/lekhani-engine"]
# lekhani-parser = { path = "/mnt/data/lekhani-engine/lekhani-parser" }
# lekhani-core   = { path = "/mnt/data/lekhani-engine/lekhani-core" }
# lekhani-ai     = { path = "/mnt/data/lekhani-engine/lekhani-ai" }

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
